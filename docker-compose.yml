services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise_copilot_postgres

    environment:
      POSTGRES_DB: enterprise_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    ports:
      - "5433:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: